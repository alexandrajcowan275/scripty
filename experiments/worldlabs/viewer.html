<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Scripty — Location memory spike</title>
  <style>
    * { box-sizing: border-box; } body { margin: 0; background: #171714; color: #f5f3ee; font: 16px/1.5 system-ui, sans-serif; }
    header { padding: 20px 24px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; background: #f5f3ee; color: #171714; }
    h1 { font-size: 24px; font-weight: 500; margin: 0 auto 0 0; } button, .file-label, select, a { font: inherit; }
    button, .file-label, select { min-height: 44px; border: 1px solid #b9b5af; border-radius: 24px; padding: 8px 18px; background: white; color: #171714; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; } :focus-visible { outline: 3px solid #2858b8; outline-offset: 3px; }
    #viewport { height: calc(100dvh - 190px); min-height: 340px; position: relative; } canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    footer { padding: 16px 24px; } #status { margin: 0 0 8px; } .hint { color: #c8c4bb; margin: 0; font-size: 14px; }
    #links a { color: #dce6ff; margin-right: 20px; } .file-label input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .file-label:focus-within { outline: 3px solid #2858b8; } @media(max-width:600px) { header { gap: 10px; padding: 16px; } h1 { width: 100%; } #viewport { height: 58dvh; } }
  </style>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
      "@sparkjsdev/spark": "https://sparkjs.dev/releases/spark/2.3.1/spark.module.js"
    } }
  </script>
</head>
<body>
  <header>
    <h1>Location memory · railway platform</h1>
    <label class="file-label">Load result JSON<input id="file" type="file" accept="application/json,.json"></label>
    <label>World <select id="stage" disabled><option value="latest">Latest</option></select></label>
    <button id="reset" disabled>Reset camera</button>
    <button id="capture" disabled>Capture still</button>
  </header>
  <main id="viewport" aria-label="Interactive set viewer"></main>
  <footer>
    <p id="status" role="status" aria-live="polite">Loading renderer…</p>
    <p class="hint">Drag to orbit · scroll to dolly · right-drag to pan · arrow keys to pan. Capture downloads a PNG; it does not send anything to Scripty.</p>
    <div id="links"></div>
  </footer>
  <script type="module">
    const status = document.querySelector('#status');
    const capture = document.querySelector('#capture');
    const reset = document.querySelector('#reset');
    const stage = document.querySelector('#stage');
    const viewport = document.querySelector('#viewport');
    let result, current, mesh, group, camera, renderer, scene, controls, THREE, SplatMesh;
    let loading = false, loadToken = 0, initialEye, initialTarget;
    function message(text) { status.textContent = text; }
    function safeLink(label, value) {
      if (!value) return;
      const url = new URL(value); if (url.protocol !== 'https:') return;
      const link = document.createElement('a'); link.textContent = label; link.href = url.href;
      link.target = '_blank'; link.rel = 'noopener noreferrer'; document.querySelector('#links').append(link);
    }
    function resetCamera() {
      if (!initialEye) return;
      camera.position.copy(initialEye); controls.target.copy(initialTarget); camera.fov = 60;
      camera.updateProjectionMatrix(); controls.update();
    }
    async function loadWorld(data) {
      const token = ++loadToken;
      loading = true; capture.disabled = reset.disabled = true; stage.disabled = true;
      message('Loading SPZ…');
      const urls = data.splat_urls ?? data.assets?.splats?.spz_urls ?? {};
      const url = urls['500k'] ?? urls['100k'] ?? urls.full_res;
      if (!url || new URL(url, location.href).protocol !== 'https:') throw new Error('No HTTPS SPZ URL in this result. Generation has not produced a viewable world yet.');
      if (mesh) { scene.remove(group); mesh.dispose(); }
      mesh = new SplatMesh({ url });
      const pendingMesh = mesh;
      let timer;
      try {
        await Promise.race([mesh.initialized, new Promise((_, reject) => { timer = setTimeout(() => reject(new Error('SPZ loading timed out after 90 seconds. Check network/CORS and open the Marble link.')), 90_000); })]);
      } catch (error) { pendingMesh.dispose(); throw error; }
      finally { clearTimeout(timer); }
      if (token !== loadToken) { pendingMesh.dispose(); return; }
      group = new THREE.Group();
      // Docs: p' = Rx(PI) * (scale*p - [0, groundOffset, 0]).
      // Scale applies to Gaussian centers AND sizes through the object transform.
      const semantics = data.semantics_metadata ?? data.assets?.splats?.semantics_metadata;
      const scale = semantics?.metric_scale_factor;
      const offset = semantics?.ground_plane_offset;
      const hasScale = Number.isFinite(scale) && scale > 0;
      mesh.scale.setScalar(hasScale ? scale : 1);
      mesh.position.y = Number.isFinite(offset) ? -offset : 0;
      group.add(mesh); group.rotation.x = Math.PI; scene.add(group);
      // Keep the camera at the original generation viewpoint in the transformed frame.
      initialEye = new THREE.Vector3(0, Number.isFinite(offset) ? offset : 0, 0);
      initialTarget = initialEye.clone().add(new THREE.Vector3(0, 0, -2));
      resetCamera(); current = data; loading = false;
      capture.disabled = reset.disabled = false; stage.disabled = !result?.runs;
      document.querySelector('#links').replaceChildren();
      safeLink('Open Marble', data.world_marble_url);
      safeLink('Panorama', data.pano_url); safeLink('Thumbnail', data.thumbnail);
      message(`${data.fixture ? 'RENDERER TEST FIXTURE — not a generated Scripty world' : `${data.model ?? 'World'} ready · ${data.world_id ?? 'ID unavailable'}`} · ${hasScale ? 'scale metadata applied' : 'scale unverified'}`);
    }
    async function acceptResult(data) {
      result = data;
      stage.replaceChildren(new Option('Latest', 'latest'));
      for (const key of Object.keys(data.runs ?? {})) stage.add(new Option(key, key));
      await loadWorld(data);
    }
    function showError(error) {
      loading = false; capture.disabled = reset.disabled = true;
      stage.disabled = !result?.runs;
      message(error instanceof Error ? error.message : 'Unable to load world.');
    }
    document.querySelector('#file').addEventListener('change', async event => {
      const file = event.target.files?.[0]; if (!file || loading) return;
      try { await acceptResult(JSON.parse(await file.text())); } catch(error) { showError(error); }
    });
    stage.addEventListener('change', async () => {
      try { await loadWorld(stage.value === 'latest' ? result : result.runs[stage.value]); } catch(error) { showError(error); }
    });
    reset.addEventListener('click', resetCamera);
    capture.addEventListener('click', async () => {
      if (loading || !current) return;
      capture.disabled = true;
      try {
        renderer.render(scene, camera);
        const blob = await new Promise(resolve => renderer.domElement.toBlob(resolve, 'image/png'));
        if (!blob) throw new Error('Capture failed: browser returned an empty canvas.');
        const url = URL.createObjectURL(blob); const link = document.createElement('a');
        link.href = url; link.download = `scripty-set-${current.world_id ?? 'test'}-${Date.now()}.png`;
        link.click(); setTimeout(() => URL.revokeObjectURL(url), 10_000);
        message('PNG captured from the current camera. Save it as the shot’s location reference.');
      } catch(error) { message(`Capture failed: ${error.message}. Check browser WebGL/CORS support.`); }
      finally { capture.disabled = false; }
    });
    try {
      THREE = await import('three');
      const spark = await import('@sparkjsdev/spark'); SplatMesh = spark.SplatMesh;
      const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
      renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); viewport.append(renderer.domElement);
      scene = new THREE.Scene(); scene.background = new THREE.Color('#171714');
      camera = new THREE.PerspectiveCamera(60, 1, 0.01, 2000);
      scene.add(new spark.SparkRenderer({ renderer }));
      controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true; controls.minDistance = 0.05; controls.maxDistance = 100;
      controls.listenToKeyEvents(window);
      const resize = () => { const { width, height } = viewport.getBoundingClientRect(); renderer.setSize(width, height); camera.aspect = width / height; camera.updateProjectionMatrix(); };
      new ResizeObserver(resize).observe(viewport); resize();
      renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
      renderer.domElement.addEventListener('webglcontextlost', event => { event.preventDefault(); capture.disabled = true; message('WebGL context lost. Reload this page to restore the viewer.'); });
      // Optional relative fixture path is for offline QA only; no API key is used in this page.
      const source = new URLSearchParams(location.search).get('result') ?? 'result.json';
      const response = await fetch(source, { signal: AbortSignal.timeout(15_000) });
      if (!response.ok) throw new Error('No result.json yet. Generate the draft, then reload, or use Load result JSON.');
      await acceptResult(await response.json());
    } catch(error) { showError(error); }
  </script>
</body>
</html>
